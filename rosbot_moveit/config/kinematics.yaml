---
manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  # OpenMANIPULATOR-X has 4 DoF, so the orientation cannot be fully resolved
  # by IK. position_only_ik=true keeps only the XYZ part of the goal pose; the
  # orientation is determined by the kinematic chain.
  position_only_ik: true
