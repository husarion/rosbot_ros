---
## Properties of incoming commands
command_in_type: speed_units   # "unitless"> in the range [-1:1], as if from joystick. "speed_units"> cmds are in m/s and rad/s
scale:
  # Scale parameters are only used if command_in_type=="unitless"
  linear: 0.3   # Max linear velocity. Unit is [m/s]. Only used for Cartesian commands.
  rotational: 0.8  # Max angular velocity. Unit is [rad/s]. Only used for Cartesian commands.
  # Max joint angular/linear velocity. Only used for joint commands on joint_command_in_topic.
  joint: 0.8

# Optionally override Servo's internal velocity scaling when near singularity or collision (0.0 = use internal velocity scaling)
# override_velocity_scaling_factor = 0.0 # valid range [0.0:1.0]

## Properties of outgoing commands
publish_period: 0.033  # 1/Nominal publish rate [seconds]
low_latency_mode: false  # Set this to true to publish as soon as an incoming Twist command is received (publish_period is ignored)

# What type of topic does your robot driver expect?
# Currently supported are std_msgs/Float64MultiArray or trajectory_msgs/JointTrajectory
command_out_type: trajectory_msgs/JointTrajectory

# What to publish? Can save some bandwidth as most robots only require positions or velocities
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

## Plugins for smoothing outgoing commands
smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin

# If is_primary_planning_scene_monitor is set to true, the Servo server's PlanningScene advertises the /get_planning_scene service,
# which other nodes can use as a source for information about the planning environment.
# NOTE: If a different node in your system is responsible for the "primary" planning scene instance (e.g. the MoveGroup node),
# then is_primary_planning_scene_monitor needs to be set to false.
# move_group.launch.py already runs move_group (see manipulator.yaml), which is the
# canonical primary PSM — servo requests scene state from it instead of running its
# own duplicate world/scene monitor. CPU-cost analysis 2026-08-17.
is_primary_planning_scene_monitor: false

# Relative name keeps it inside the robot namespace (default "/planning_scene" leaks to root).
monitored_planning_scene_topic: planning_scene

## MoveIt properties
move_group_name: manipulator
# Arm base, not robot base - consistent IK regardless of robot pose / namespace.
planning_frame: link1

## Other frames
ee_frame_name: end_effector_link  # The name of the end effector link, used to return the EE pose
robot_link_command_frame: end_effector_link  # commands must be given in the frame of a robot link. Usually either the base or end effector

## Stopping behaviour
incoming_command_timeout: 0.15   # Stop servoing if X seconds elapse without a new command. Must be > joy_node autorepeat period (50 ms at 20 Hz) - otherwise servo halts between joy messages and the arm stutters. Stop-on-release responsiveness comes from joy2servo publishing a zero-velocity JointJog on stick centring, not from this timeout.
# If 0, republish commands forever even if the robot is stationary. Otherwise, specify num. to publish.
# Important because ROS may drop some messages and we need the robot to halt reliably.
num_outgoing_halt_msgs_to_publish: 4

## Configure handling of singularities and joint limits
# Inert here - joy2servo uses JointJog path which skips this guard. See CLAUDE.md 2026-05-15.
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
joint_limit_margin: 0.1 # added as a buffer to joint limits [radians]. If moving quickly, make this larger.
leaving_singularity_threshold_multiplier: 1.0 # Multiply the hard stop limit by this when leaving singularity (see https://github.com/ros-planning/moveit2/pull/620)

## Topic names
cartesian_command_in_topic: ~/delta_twist_cmds  # Topic for incoming Cartesian twist commands
joint_command_in_topic: ~/delta_joint_cmds # Topic for incoming joint angle commands
joint_topic: joint_states
status_topic: ~/status # Publish status to this topic
command_out_topic: manipulator_controller/joint_trajectory # Publish outgoing commands here

## Collision checking for the entire robot body
check_collisions: true
# 20 Hz (upstream default 10 Hz, was 30 Hz): @1 rad/s Cartesian clamp
# (joy2servo's cartesian_max_joint_velocity default), distance covered per
# tick is ~300/rate_hz mm. 10 Hz -> 30 mm > 20 mm threshold (no ramp, unsafe);
# 20 Hz -> 15 mm, still a real 1.33x margin under the threshold; 30 Hz -> 10 mm.
# collision_monitor.cpp runs this as its own always-on loop independent of
# publish_period, doing two full FCL checks (self + scene) every tick — the
# single highest CPU-cost loop in the manipulator stack (measured ~91% of one
# core on the Jetson). Dropped from 30->20 Hz for a ~33% cut on that loop
# while keeping real margin. CPU-cost analysis 2026-08-17 — re-verify on HW
# (fast jog toward self-collision/an obstacle, confirm it still stops before
# contact) before trusting this in the field.
collision_check_rate: 20.0 # [Hz]
# 0.02 m: raising it triggers false positives because some non-SRDF-disabled
# link pairs rest within 5 cm and would clamp velocity to ~0 at startup.
self_collision_proximity_threshold: 0.02 # [m]
scene_collision_proximity_threshold: 0.03 # Start decelerating when a scene collision is this far [m]
