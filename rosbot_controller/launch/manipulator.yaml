---
launch:

  - arg:
      name: arm_activate
      default: 'True'
      description: Whether to activate the manipulator controllers
      choice:
        - value: 'True'
        - value: 'False'

  - arg:
      name: servo_enabled
      default: $(var arm_activate)
      description: >-
        Whether to start servo_node + joy2servo (joystick teleop backend for the
        manipulator). Defaults to arm_activate, but can be set independently --
        e.g. to keep the arm active while skipping servo_node's always-on
        collision-checking loop (~91% of one CPU core, see MANIPULATOR.md) when
        the joystick won't be used this session.

  - include:
      file: $(find-pkg-share rosbot_moveit)/launch/move_group.launch.py

  - include:
      file: $(find-pkg-share rosbot_moveit)/launch/servo.launch.py
      arg:
        - name: servo_enabled
          value: $(var servo_enabled)

  - include:
      file: $(find-pkg-share rosbot_moveit)/launch/home.launch.py
      if: $(var arm_activate)
