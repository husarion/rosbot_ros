---
# Custom components (own URDF + mesh): https://github.com/husarion/husarion_components_description#custom-component
components:
  - type: custom
    package: rosbot_description
    file: urdf/rosbot_xl/components/camera_mount.urdf.xacro
    macro_name: camera_mount
    # `name` intentionally omitted - camera_mount's own link names
    # (camera_mount_link, camera_mount_bot_link, ...) are already fully
    # qualified; a `name` here would double-prefix them.
    parent_link: cover_link
    xyz: -0.1 0.0 0.0
    rpy: 0.0 0.0 0.0
    camera_mount_angle_1: 0.7854
    camera_mount_angle_2: 0.7854

  - type: oak_1_lite
    parent_link: camera_mount_link
    xyz: -0.015 0.0 0.024
    rpy: 0.0 -1.57 0.0
