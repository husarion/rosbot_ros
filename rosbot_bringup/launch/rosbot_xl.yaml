---
launch:

  - arg:
      name: config_dir
      default: ''
      description: Path to the common configuration directory. You can create such common configuration
        directory with `ros2 run rosbot_utils create_config_dir {directory}`.

  - arg:
      name: led_strip
      default: 'True'
      description: ROSbot XL only. Enable or disable the LED strip.
      choice:
        - value: 'True'
        - value: 'False'

  - arg:
      name: led_animation
      default: ready
      description: ROSbot XL only. LED animation published by default. 'none' publishes nothing (the firmware
        idle animation shows); any other value is an animation discovered under rosbot_utils/animations
        (or the user dir). Switch live with `ros2 param set /<ns>/animation_publisher current_animation
        <name>`.

  - arg:
      name: hardware_bridge
      default: 'True'
      description: Launch the SBC<->MCU bridge (selected by backend). Set to 'False' to skip it entirely
        (e.g. when running the bridge/agent in a separate container).
      choice:
        - value: 'True'
        - value: 'False'

  - arg:
      name: backend
      default: mavlink
      description: Which MCU<->SBC protocol stack the hardware bridge speaks. 'mavlink' (default) starts
        the rosbot_mavlink_bridge node; 'microros' starts the XRCE-DDS agent (compatible with the legacy
        micro-ROS-only firmware). Requires the runtime-switch firmware variant on the MCU.
      choice:
        - value: microros
        - value: mavlink

  - arg:
      name: namespace
      default: $(env ROBOT_NAMESPACE '')
      description: Add namespace to all launched nodes.

  - arg:
      name: tf_namespace_bridge
      default: 'True'
      description: Bridge robot's namespaced TF to the global /tf and /tf_static.
      choice:
        - value: 'True'
        - value: 'False'

  - arg:
      name: robot_model
      default: rosbot_xl
      description: Specify robot model

  - arg:
      name: asset_server
      default: 'True'
      description: Launch husarion_asset_server, serving this robot's package:// meshes/URDF resources
        to the bridge's get_asset service.
      choice:
        - value: 'True'
        - value: 'False'

  - set_env:
      name: RCUTILS_COLORIZED_OUTPUT
      value: '1'

  - set_env:
      name: RCUTILS_CONSOLE_OUTPUT_FORMAT
      value: '[{severity}] [{date_time_with_ms}] [{name}]: {message}'

  - log:
      message: Bringing up ROSbot XL, namespace=$(var namespace), configuration=base, led_strip=$(var
        led_strip)

  - push_ros_namespace:
      namespace: $(var namespace)

  - let:
      name: animation_publisher_config
      value: $(eval "('$(var config_dir)/rosbot_utils' if '$(var config_dir)' else '$(find-pkg-share rosbot_utils)')
        + '/config/' + '$(var robot_model)' + '/config.yaml'")

  - let:
      name: animations_dir
      value: $(eval "('$(var config_dir)/rosbot_utils/animations' if '$(var config_dir)' else '')")

  # tf_namespace_bridge now launched from rosbot_description (config dedup).
  - set_remap:
      from: /diagnostics
      to: diagnostics
  - set_remap:
      from: /tf
      to: tf
  - set_remap:
      from: /tf_static
      to: tf_static

  - include:
      file: $(find-pkg-share rosbot_bringup)/launch/$(var backend).launch.py
      if: $(var hardware_bridge)
      let:
        - name: robot_model
          value: $(var robot_model)

  - include:
      file: $(find-pkg-share rosbot_controller)/launch/controller.yaml

  - include:
      file: $(find-pkg-share rosbot_joy)/launch/joy.yaml

  - include:
      file: $(find-pkg-share rosbot_localization)/launch/ekf.yaml

  - node:
      pkg: husarion_asset_server
      exec: asset_server
      if: $(var asset_server)

#  Dont work in snap
#   - include:
#       file: $(find-pkg-share rosbot_utils)/launch/battery_alert.yaml
#       let:
#         - name: robot_model
#           value: $(var robot_model)

  - node:
      pkg: rosbot_utils
      exec: animation_publisher
      name: animation_publisher
      if: $(eval '"$(var led_strip)" == "True"')
      param:
        # Config first, launch args second: led_animation and config_dir are
        # explicit choices at launch time and must win over the file.
        - from: $(var animation_publisher_config)
        - name: current_animation
          value: $(var led_animation)
        - name: user_animations_dir
          value: $(var animations_dir)
