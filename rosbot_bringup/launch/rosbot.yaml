---
launch:

  - arg:
      name: config_dir
      default: ''
      description: Path to the common configuration directory. You can create such common configuration
        directory with `ros2 run rosbot_utils create_config_dir {directory}`.

  - arg:
      name: microros
      default: 'True'
      description: Automatically communicate with hardware using the chosen link layer. Set to 'False'
        to skip link-layer launch.
      choice:
        - value: 'True'
        - value: 'False'

  - arg:
      name: link_layer
      default: microros
      description: Which MCU<->SBC protocol stack to launch when microros=True. 'microros' starts the
        XRCE-DDS agent. 'mavlink' starts the rosbot_mavlink_bridge node (requires the MAVLink firmware
        + the rosbot_mavlink_bridge package on the overlay).
      choice:
        - value: microros
        - value: mavlink

  - arg:
      name: namespace
      default: $(env ROBOT_NAMESPACE '')
      description: Add namespace to all launched nodes.

  - arg:
      name: tf_namespace_bridge
      default: 'True'
      description: Bridge robot's namespaced TF to the global /tf and /tf_static.
      choice:
        - value: 'True'
        - value: 'False'

  - arg:
      name: robot_model
      default: rosbot
      description: Specify robot model
      choice:
        - value: rosbot
        - value: rosbot_xl

  - set_env:
      name: RCUTILS_COLORIZED_OUTPUT
      value: '1'

  - push_ros_namespace:
      namespace: $(var namespace)

  - let:
      name: tf_namespace_bridge_config
      value: $(eval "('$(var config_dir)/rosbot_bringup' if '$(var config_dir)' else '$(find-pkg-share
        rosbot_bringup)') + '/config/tf_namespace_bridge.yaml'")

  - node:
      pkg: tf_namespace_bridge
      exec: tf_namespace_bridge
      if: $(eval '"$(var tf_namespace_bridge)" == "True" and "$(var namespace)" != ""')
      param:
        - from: $(var tf_namespace_bridge_config)

  - set_remap:
      from: /diagnostics
      to: diagnostics
  - set_remap:
      from: /tf
      to: tf
  - set_remap:
      from: /tf_static
      to: tf_static

  - include:
      file: $(find-pkg-share rosbot_bringup)/launch/microros.launch.py
      if: $(eval '"$(var microros)" == "True" and "$(var link_layer)" == "microros"')
      let:
        - name: robot_model
          value: $(var robot_model)

  - include:
      file: $(find-pkg-share rosbot_bringup)/launch/mavlink_bridge.launch.py
      if: $(eval '"$(var microros)" == "True" and "$(var link_layer)" == "mavlink"')
      let:
        - name: robot_model
          value: $(var robot_model)

  - include:
      file: $(find-pkg-share rosbot_controller)/launch/controller.yaml

  - include:
      file: $(find-pkg-share rosbot_joy)/launch/joy.yaml

  - include:
      file: $(find-pkg-share rosbot_localization)/launch/ekf.yaml

  - include:
      file: $(find-pkg-share rosbot_utils)/launch/laser_filter.yaml
      let:
        - name: robot_model
          value: $(var robot_model)
