---
launch:

  - arg:
      name: asset_server
      default: 'True'
      description: Launch husarion_asset_server, serving this robot's package:// meshes/URDF resources
        to the bridge's get_asset service.
      choice:
        - value: 'True'
        - value: 'False'

  - arg:
      name: config_dir
      default: ''
      description: Path to the common configuration directory. You can create such common configuration
        directory with `ros2 run rosbot_utils create_config_dir {directory}`.

  - arg:
      name: hardware_bridge
      default: 'True'
      description: Launch the SBC<->MCU MAVLink bridge (rosbot_mavlink_bridge). Set to 'False' to skip
        it entirely (e.g. when running the bridge in a separate container).
      choice:
        - value: 'True'
        - value: 'False'

  - arg:
      name: namespace
      default: $(env ROBOT_NAMESPACE '')
      description: Add namespace to all launched nodes.

  - arg:
      name: robot_model
      default: rosbot
      description: Specify robot model
      choice:
        - value: rosbot
        - value: rosbot_xl

  - set_env:
      name: RCUTILS_COLORIZED_OUTPUT
      value: '1'

  - set_env:
      name: RCUTILS_CONSOLE_OUTPUT_FORMAT
      value: '[{severity}] [{date_time_with_ms}] [{name}]: {message}'

  - log:
      message: Bringing up ROSbot, namespace=$(var namespace)

  - push_ros_namespace:
      namespace: $(var namespace)

  - set_remap:
      from: /diagnostics
      to: diagnostics
  - set_remap:
      from: /tf
      to: tf
  - set_remap:
      from: /tf_static
      to: tf_static

  - include:
      file: $(find-pkg-share rosbot_bringup)/launch/mavlink.launch.py
      if: $(var hardware_bridge)
      let:
        - name: robot_model
          value: $(var robot_model)

  - include:
      file: $(find-pkg-share rosbot_controller)/launch/controller.yaml

  - include:
      file: $(find-pkg-share rosbot_joy)/launch/joy.yaml

  - include:
      file: $(find-pkg-share rosbot_localization)/launch/ekf.yaml

  - node:
      pkg: husarion_asset_server
      exec: asset_server
      if: $(var asset_server)
